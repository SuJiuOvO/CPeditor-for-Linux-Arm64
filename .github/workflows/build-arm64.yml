name: Build CP Editor for Linux ARM64

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-arm64:
    name: Build Linux ARM64 Package
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout CP Editor Repository
        uses: actions/checkout@v4
        with:
          repository: cpeditor/cpeditor
          submodules: recursive
          fetch-depth: 1

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            git \
            python3 \
            qt6-base-dev \
            qt6-base-dev-tools \
            qt6-5compat-dev \
            qt6-tools-dev \
            qt6-tools-dev-tools \
            qt6-declarative-dev \
            libqt6core5compat6 \
            libgl1-mesa-dev

      - name: Build and Install KDE Extra CMake Modules (ECM)
        run: |
          git clone --depth=1 --branch v6.0.0 https://github.com/KDE/extra-cmake-modules.git
          cd extra-cmake-modules
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_HTML_DOCS=OFF \
            -DBUILD_MAN_DOCS=OFF \
            -DBUILD_QTHELP_DOCS=OFF \
            -DBUILD_TESTING=OFF
          cmake --build build -j$(nproc)
          sudo cmake --install build
          cd ..

      - name: Build and Install KDE KF6 Syntax Highlighting
        run: |
          git clone --depth=1 --branch v6.0.0 https://github.com/KDE/syntax-highlighting.git
          cd syntax-highlighting
          # Ubuntu 24.04 提供 Qt 6.4.2，将 v6.0.0 默认的 6.5.0 阈值调整为 6.4.0（语法高亮引擎完全兼容）
          sed -i 's/6.5.0/6.4.0/g' CMakeLists.txt
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF \
            -DQT_MAJOR_VERSION=6 \
            -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build build -j$(nproc)
          sudo cmake --install build
          cd ..

      - name: Configure and Build CP Editor
        run: |
          cmake -B build -S . -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build build -j$(nproc)

      - name: Package DEB & Standalone Portable TAR.GZ
        run: |
          # 1. 临时安装目录
          mkdir -p package_root
          DESTDIR=$(pwd)/package_root cmake --install build

          # 将编译好的 KDE 语法高亮动态库一并打包进安装包
          mkdir -p package_root/usr/lib
          find /usr -name "libKF6SyntaxHighlighting.so*" -exec cp -d {} package_root/usr/lib/ \; 2>/dev/null || true

          # 2. 构建 .deb 控制文件
          mkdir -p package_root/DEBIAN
          {
            echo "Package: cpeditor"
            echo "Version: 7.3.0"
            echo "Section: devel"
            echo "Priority: optional"
            echo "Architecture: arm64"
            echo "Depends: libc6, libqt6widgets6, libqt6core5compat6, libqt6network6"
            echo "Maintainer: cpeditor"
            echo "Description: CP Editor - The IDE for competitive programming (Linux ARM64 build)"
          } > package_root/DEBIAN/control

          dpkg-deb --build package_root cpeditor-7.3.0-linux-arm64.deb

          # 3. 构建免安装便携版
          mkdir -p cpeditor-portable/bin cpeditor-portable/lib
          cp package_root/usr/bin/cpeditor cpeditor-portable/bin/
          find /usr -name "libKF6SyntaxHighlighting.so*" -exec cp -d {} cpeditor-portable/lib/ \; 2>/dev/null || true

          {
            echo '#!/bin/bash'
            echo 'SCRIPT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"'
            echo 'export LD_LIBRARY_PATH="$SCRIPT_DIR/lib:$LD_LIBRARY_PATH"'
            echo 'exec "$SCRIPT_DIR/bin/cpeditor" "$@"'
          } > cpeditor-portable/cpeditor.sh

          chmod +x cpeditor-portable/cpeditor.sh cpeditor-portable/bin/cpeditor

          tar -czvf cpeditor-7.3.0-linux-arm64.tar.gz -C cpeditor-portable .

          # 归档到 dist 目录
          mkdir -p dist
          mv cpeditor-7.3.0-linux-arm64.deb dist/
          mv cpeditor-7.3.0-linux-arm64.tar.gz dist/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cpeditor-7.3.0-linux-arm64
          path: dist/*
          retention-days: 7
